<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Multi-Timezone Digital Clock - View current time across 12 major cities worldwide">
    <meta name="theme-color" content="#667eea">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>⏰</text></svg>">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🌍 Multi-Timezone Clock</h1>
            <p class="subtitle">View current time across major cities worldwide</p>
            <div class="last-update">
                Last updated: <strong id="lastUpdate">--:--:--</strong>
            </div>
        </header>

        <!-- Clocks Container -->
        <div id="clocksContainer"></div>

        <!-- Footer -->
        <footer>
            <p>⏱️ Updates every second | 🎨 Built with Vanilla JavaScript | 💜 Full Stack Developer Portfolio</p>
        </footer>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
